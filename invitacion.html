  <script src="js/app.js" onerror="document.body.classList.remove('cargando');document.getElementById('app').innerHTML='<div style=&quot;min-height:100vh;display:grid;place-content:center;gap:12px;text-align:center;padding:24px;font-family:system-ui;max-width:560px;margin:auto&quot;><h1>Faltan archivos de la invitación</h1><p>Esta página necesita las carpetas <b>js</b>, <b>css</b>, <b>eventos</b> e <b>img</b> a su lado.</p><p>1. Descomprime el .zip completo (clic derecho → Extraer todo).<br>2. Abre <b>index.html</b> desde la carpeta ya descomprimida.</p><p>O usa los archivos de la carpeta <b>listas/</b>: cada uno funciona solo.</p></div>'"></script>
