  <style>
/* =====================================================================
   Estilos base compartidos por todas las plantillas.
   Cada tema (css/temas/*.css) redefine las variables de :root y agrega
   sus propias decoraciones.
   ===================================================================== */
:root {
  --bg: #ffffff;
  --bg-alt: #f6f4f1;
  --surface: #ffffff;
  --text: #2a2a2a;
  --muted: #6d6a66;
  --accent: #b08d57;
  --accent-2: #2a2a2a;
  --on-accent: #ffffff;
  --border: rgba(0, 0, 0, .1);
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-script: cursive;
  --radius: 14px;
  --btn-radius: 999px;
  --shadow: 0 12px 40px rgba(0, 0, 0, .08);
  --hero-text: #ffffff;
  --hero-overlay: linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.55));
  --orn-glyph: "✦";
  --fx-colors: #d4af37, #f3e5ab;
  --pad: clamp(72px, 11vw, 128px);
  --maxw: 1120px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-size: 17px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.cargando #app { opacity: 0; }
#app { transition: opacity .5s ease; }
body.intro-abierta { overflow: hidden; }
img { max-width: 100%; display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
.ico { width: 1.2em; height: 1.2em; flex: none; }

.container { width: min(var(--maxw), 100% - 40px); margin-inline: auto; }
.narrow { max-width: 760px; }
.container.narrow { width: min(760px, 100% - 40px); }
.center { text-align: center; margin-inline: auto; }

main > section { padding: var(--pad) 0; position: relative; }
main > section.alt { background: var(--bg-alt); }

/* ---------- Encabezados de sección ---------- */
.section-head { text-align: center; margin-bottom: clamp(36px, 5vw, 60px); }
.section-kicker { font-family: var(--font-script); color: var(--accent); font-size: clamp(1.7rem, 3.5vw, 2.4rem); line-height: 1.1; }
.section-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.15; margin-top: .25em; }
.section-orn {
  display: flex; align-items: center; justify-content: center; width: 170px; height: 18px; margin: 18px auto 0;
  color: var(--accent); font-size: 15px; line-height: 1;
  background: linear-gradient(currentColor, currentColor) left center / 60px 1px no-repeat,
              linear-gradient(currentColor, currentColor) right center / 60px 1px no-repeat;
}
.section-orn::before { content: var(--orn-glyph); }

.lead { font-size: clamp(1.08rem, 2.2vw, 1.25rem); color: var(--muted); max-width: 680px; margin: 0 auto 1.5em; }
.lead.center { text-align: center; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  padding: .85em 1.8em; border-radius: var(--btn-radius);
  background: var(--accent); color: var(--on-accent);
  border: 1px solid var(--accent);
  font-size: .82rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 600;
  text-decoration: none; transition: transform .25s ease, box-shadow .25s ease, background .25s ease, color .25s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .carousel:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.btn-ghost { background: transparent; color: var(--accent); }
.btn-ghost:hover { background: var(--accent); color: var(--on-accent); }
.btn-sm { padding: .65em 1.2em; font-size: .72rem; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .6; pointer-events: none; }
.btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }

/* ---------- Navegación ---------- */
.topnav {
  position: fixed; inset: 0 0 auto; z-index: 50; display: flex; align-items: center; gap: 20px;
  padding: 14px clamp(16px, 4vw, 40px); transform: translateY(-110%); transition: transform .4s ease, background .4s;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.topnav.scrolled, .topnav.open { transform: none; }
.brand { font-family: var(--font-script); font-size: 1.6rem; color: var(--accent); text-decoration: none; line-height: 1; }
.nav-links { margin-left: auto; display: flex; gap: clamp(12px, 2vw, 26px); }
.nav-links a { text-decoration: none; font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); transition: color .2s; }
.nav-links a:hover { color: var(--accent); }
.nav-toggle { display: none; margin-left: auto; font-size: 1.4rem; color: var(--text); }
@media (max-width: 860px) {
  .nav-toggle { display: inline-flex; }
  .nav-links { position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; gap: 0; background: var(--bg); border-bottom: 1px solid var(--border); max-height: 0; overflow: hidden; transition: max-height .35s ease; }
  .nav-links a { padding: 14px 24px; border-top: 1px solid var(--border); }
  .topnav.open .nav-links { max-height: 80vh; }
}

/* ---------- Portada (hero) ---------- */
.hero {
  position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
  text-align: center; color: var(--hero-text); overflow: hidden; isolation: isolate;
  background: var(--accent-2);
}
.hero-inner { width: 100%; padding: 110px 20px 90px; }
.hero-photo { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.hero-photo img { width: 100%; height: 100%; object-fit: cover; animation: kenburns 24s ease-in-out infinite alternate; }
.hero-photo::after { content: ""; position: absolute; inset: 0; background: var(--hero-overlay); }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08); } }
.hero-content { position: relative; z-index: 2; max-width: 880px; margin: 0 auto; animation: subir 1.2s .2s both; }
.eyebrow { font-size: .8rem; letter-spacing: .4em; text-transform: uppercase; opacity: .9; }
.hero-sub { font-family: var(--font-display); font-style: italic; font-size: 1.15rem; margin-top: .6em; opacity: .9; }
.hero-names { font-family: var(--font-script); font-weight: 400; font-size: clamp(3.4rem, 11vw, 7.5rem); line-height: 1.05; margin: .25em 0 .3em; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; column-gap: .25em; }
.hero-names .amp { font-size: .6em; opacity: .85; }
.hero-date { display: inline-grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: clamp(12px, 3vw, 24px); margin: .4em auto 1.2em; font-family: var(--font-display); }
.hd-side { font-size: clamp(.78rem, 2vw, .95rem); letter-spacing: .25em; text-transform: uppercase; padding: .5em 0; border-block: 1px solid currentColor; min-width: 7em; }
.hd-day { font-size: clamp(2.6rem, 7vw, 4rem); line-height: 1; }
.hero-phrase { font-family: var(--font-display); font-style: italic; font-size: clamp(1.05rem, 2.4vw, 1.3rem); max-width: 560px; margin: 0 auto 2em; opacity: .92; }
.btn-hero { margin-top: .5em; }
.scroll-hint { position: absolute; bottom: 26px; left: 50%; translate: -50% 0; z-index: 3; color: var(--hero-text); font-size: 1.4rem; opacity: .8; animation: bote 2s infinite; }
@keyframes bote { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
@keyframes subir { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
.fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

/* ---------- Intro / sobre ---------- */
.intro {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px;
  background: var(--intro-bg, var(--bg)); transition: opacity .9s ease, visibility .9s, transform .9s ease;
}
.intro.cerrar { opacity: 0; visibility: hidden; transform: scale(1.06); }
.intro-card { text-align: center; max-width: 440px; width: 100%; padding: clamp(36px, 7vw, 56px) 28px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); animation: subir 1s both; }
.intro-kicker { font-size: .74rem; letter-spacing: .35em; text-transform: uppercase; color: var(--muted); }
.seal { width: 92px; height: 92px; margin: 22px auto; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent) 60%, color-mix(in srgb, var(--accent) 70%, #000)); color: var(--on-accent); font-family: var(--font-script); font-size: 1.9rem; box-shadow: 0 6px 16px rgba(0,0,0,.2), inset 0 0 0 5px color-mix(in srgb, var(--accent) 80%, #000); }
.intro-names { font-family: var(--font-script); font-size: clamp(2.4rem, 9vw, 3.4rem); line-height: 1.1; color: var(--text); display: flex; flex-wrap: wrap; justify-content: center; column-gap: .25em; }
.intro-names .amp { color: var(--accent); }
.intro-date { margin: 10px 0 6px; letter-spacing: .2em; text-transform: uppercase; font-size: .8rem; color: var(--muted); }
.intro-para { margin-bottom: 4px; color: var(--muted); }
.intro .btn { margin-top: 22px; }

/* ---------- Pase personalizado ---------- */
.pase { padding: 56px 0 0 !important; }
.pase-card { text-align: center; padding: 34px 24px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--surface); position: relative; }
.pase-card::before { content: ""; position: absolute; inset: 6px; border: 1px dashed color-mix(in srgb, var(--accent) 60%, transparent); border-radius: calc(var(--radius) - 4px); pointer-events: none; }
.pase-label { font-size: .75rem; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.pase-nombre { font-family: var(--font-script); font-size: clamp(2rem, 6vw, 2.8rem); color: var(--accent); line-height: 1.2; margin: .2em 0; }
.pase-lugares strong { font-family: var(--font-display); font-size: 1.4em; color: var(--accent); }

/* ---------- Bienvenida ---------- */
.cita { font-family: var(--font-display); font-style: italic; font-size: clamp(1.15rem, 2.6vw, 1.45rem); margin: 1.5em auto; max-width: 600px; }
.cita cite { display: block; font-style: normal; font-size: .75rem; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); margin-top: 1em; }
.padres { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 28px; margin-top: 44px; }
.padres-grupo h3 { font-size: .75rem; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: .7em; }
.padres-grupo p { font-family: var(--font-display); font-size: 1.2rem; }

/* ---------- Cuenta regresiva ---------- */
.countdown { display: flex; justify-content: center; gap: clamp(10px, 3vw, 26px); }
.cd-item { min-width: clamp(72px, 19vw, 128px); padding: clamp(16px, 3vw, 26px) 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; }
.cd-num { font-family: var(--font-display); font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.cd-label { text-transform: uppercase; letter-spacing: .18em; font-size: .68rem; color: var(--muted); margin-top: 8px; }
.cd-fecha { margin-top: 28px; font-family: var(--font-display); font-size: 1.15rem; }

/* ---------- Historia (línea de tiempo) ---------- */
.timeline { position: relative; display: grid; gap: clamp(36px, 6vw, 64px); }
.timeline::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--accent) 50%, transparent); }
.tl-item { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(40px, 8vw, 96px); align-items: center; }
.tl-alt .tl-photo { order: 2; }
.tl-photo img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius); box-shadow: var(--shadow); }
.tl-empty { min-height: 1px; }
.tl-dot { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; translate: -50% -50%; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 15%, transparent); }
.tl-date { font-size: .75rem; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.tl-body h3 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.5rem, 3vw, 2rem); margin: .2em 0 .4em; line-height: 1.2; }
.tl-body p { color: var(--muted); }
@media (max-width: 760px) {
  .timeline::before { left: 8px; }
  .tl-item { grid-template-columns: 1fr; gap: 18px; padding-left: 36px; }
  .tl-alt .tl-photo { order: 0; }
  .tl-dot { left: 8px; top: 12px; translate: -50% 0; }
  .tl-empty { display: none; }
}

/* ---------- Tarjetas ---------- */
.cards { display: grid; gap: clamp(18px, 3vw, 28px); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.cards-1 { max-width: 460px; margin-inline: auto; }
.cards-2 { max-width: 860px; margin-inline: auto; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: clamp(28px, 4vw, 40px) clamp(22px, 3vw, 32px); text-align: center; box-shadow: var(--shadow); transition: transform .3s ease; }
.card:hover { transform: translateY(-4px); }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1.2; margin-bottom: .4em; }
.card p { color: var(--muted); }
.card-icon { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); font-size: 1.6rem; }
.ev-time { font-family: var(--font-display); font-size: 1.3rem; color: var(--accent) !important; }
.ev-place { font-weight: 600; color: var(--text) !important; margin-top: .4em; }
.ev-address { font-size: .95rem; }
.card-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }

/* ---------- Mapa ---------- */
.tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 22px; }
.tab { padding: .6em 1.3em; border-radius: var(--btn-radius); border: 1px solid var(--border); font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--surface); transition: .2s; }
.tab.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.map-frame { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); background: var(--surface); aspect-ratio: 16 / 9; max-height: 480px; width: 100%; }
.map-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
@media (max-width: 600px) { .map-frame { aspect-ratio: 4 / 5; } }

/* ---------- Itinerario ---------- */
.agenda { list-style: none; display: grid; gap: 4px; }
.agenda li { display: grid; grid-template-columns: 92px 44px 1fr; align-items: center; gap: 14px; padding: 16px 6px; border-bottom: 1px solid var(--border); }
.ag-hora { font-family: var(--font-display); font-size: 1.25rem; color: var(--accent); text-align: right; }
.ag-ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); }
.ag-txt { font-size: 1.05rem; }

/* ---------- Vestimenta ---------- */
.dress-card { max-width: 560px; margin: 0 auto; }
.dress-code { font-size: clamp(1.8rem, 4vw, 2.4rem) !important; color: var(--accent); }
.swatches { display: flex; justify-content: center; gap: 10px; margin: 20px 0 6px; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border), 0 4px 10px rgba(0,0,0,.1); }
.nota { font-size: .9rem; font-style: italic; margin-top: 14px; }

/* ---------- Carrusel ---------- */
.carousel { position: relative; max-width: 940px; margin: 0 auto; outline: none; }
.carousel-viewport { overflow: hidden; border-radius: var(--radius); box-shadow: var(--shadow); touch-action: pan-y; cursor: grab; background: var(--surface); }
.carousel-viewport:active { cursor: grabbing; }
.carousel-track { display: flex; transition: transform .6s cubic-bezier(.22, .8, .2, 1); }
.carousel-slide { flex: 0 0 100%; position: relative; user-select: none; }
.carousel-slide img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; cursor: zoom-in; }
.carousel-slide figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 20px 16px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.55)); font-family: var(--font-display); font-style: italic; font-size: 1.1rem; text-align: center; }
.carousel-btn { position: absolute; top: calc(50% - 22px); translate: 0 -50%; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--text); box-shadow: var(--shadow); font-size: 1.3rem; transition: .2s; }
.carousel-btn:hover { background: var(--accent); color: var(--on-accent); }
.carousel-btn.prev { left: -22px; }
.carousel-btn.next { right: -22px; }
@media (max-width: 1000px) { .carousel-btn.prev { left: 10px; } .carousel-btn.next { right: 10px; } }
.carousel-dots { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
.carousel-dots button { width: 9px; height: 9px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 30%, transparent); transition: .3s; padding: 0; }
.carousel-dots button.active { width: 28px; background: var(--accent); }

.lightbox { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.92); display: grid; place-items: center; padding: 20px; animation: fade .3s; }
.lightbox img { max-width: 100%; max-height: 88vh; border-radius: 6px; }
.lb-close, .lb-nav { position: absolute; color: #fff; font-size: 1.6rem; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.1); }
.lb-close { top: 16px; right: 16px; }
.lb-prev { left: 16px; top: 50%; translate: 0 -50%; }
.lb-next { right: 16px; top: 50%; translate: 0 -50%; }
@keyframes fade { from { opacity: 0; } }

/* ---------- Padrinos ---------- */
.padrinos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
.padrino { text-align: center; padding: 24px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
.padrino-rol { font-size: .72rem; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.padrino-nombres { font-family: var(--font-display); font-size: 1.2rem; margin-top: 6px; }

/* ---------- Regalos ---------- */
.cuenta { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.cuenta code { font-family: ui-monospace, Menlo, monospace; font-size: .95rem; padding: .4em .8em; border-radius: 8px; background: color-mix(in srgb, var(--accent) 10%, transparent); letter-spacing: .05em; }
.btn-copy { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: .8rem; padding: .4em .6em; border-radius: 8px; }
.btn-copy:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.titular { font-size: .88rem; margin-top: 6px; }

/* ---------- RSVP ---------- */
.rsvp-limite { color: var(--muted); margin-bottom: 26px; }
.rsvp-card { text-align: left; }
.field { display: grid; gap: 6px; margin-bottom: 18px; border: 0; }
.field[hidden] { display: none; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field-row[hidden] { display: none; }
@media (max-width: 560px) { .field-row { grid-template-columns: 1fr; gap: 0; } }
.field label, .field legend { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; font: inherit; color: var(--text); background: var(--bg); padding: .8em 1em;
  border: 1px solid var(--border); border-radius: calc(var(--radius) * .6); transition: border-color .2s, box-shadow .2s;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice label { position: relative; cursor: pointer; text-transform: none; letter-spacing: 0; font-size: 1rem; font-weight: 400; color: var(--text); margin: 0; }
.choice input { position: absolute; opacity: 0; }
.choice span { display: block; text-align: center; padding: .9em .6em; border: 1px solid var(--border); border-radius: calc(var(--radius) * .6); transition: .2s; background: var(--bg); }
.choice input:checked + span { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); color: var(--accent); font-weight: 600; }
.choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.form-error { color: #c0392b; font-size: .92rem; margin-bottom: 12px; }
.demo-note { font-size: .8rem; color: var(--muted); margin-top: 14px; text-align: center; }
.demo-note code { font-size: .9em; }
.rsvp-gracias { text-align: center; animation: subir .6s both; }
.gracias-ico { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 1.8rem; }
.rsvp-gracias h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; margin-bottom: .3em; }

/* ---------- Pie ---------- */
.footer { position: relative; overflow: hidden; padding: clamp(70px, 10vw, 110px) 0 50px; background: var(--accent-2); color: var(--hero-text); }
.footer .container { position: relative; z-index: 2; }
.footer-msg { font-family: var(--font-display); font-style: italic; font-size: clamp(1.1rem, 2.5vw, 1.35rem); max-width: 620px; margin: 0 auto 1em; opacity: .9; }
.footer-names { font-family: var(--font-script); font-size: clamp(2.6rem, 8vw, 4.2rem); line-height: 1.1; display: flex; flex-wrap: wrap; justify-content: center; column-gap: .25em; }
.hashtag { margin-top: 14px; letter-spacing: .15em; font-weight: 600; color: var(--accent); }
.footer-small { margin-top: 40px; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; opacity: .6; }

/* ---------- Música, toast, festejo ---------- */
.music-btn { position: fixed; right: 18px; bottom: 18px; z-index: 60; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow); font-size: 1.3rem; }
.music-btn.playing .ico { animation: girar 4s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: 24px; translate: -50% 140%; opacity: 0; visibility: hidden; z-index: 300; background: var(--text); color: var(--bg); padding: .7em 1.4em; border-radius: 99px; font-size: .9rem; transition: translate .35s ease; pointer-events: none; }
.toast.show { translate: -50% 0; opacity: 1; visibility: visible; }
.festejo { position: fixed; inset: 0; z-index: 250; pointer-events: none; }

/* ---------- Animación al hacer scroll ---------- */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .9s ease, transform .9s ease; }
.reveal.visible { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
  html { scroll-behavior: auto; }
}

.error-carga { min-height: 100vh; display: grid; place-content: center; gap: 12px; text-align: center; padding: 24px; }

/* =====================================================================
   TEMA: ELEGANTE — marfil, negro y dorado. Lujo minimalista.
   Ideal para: bodas de noche, graduaciones, aniversarios, galas.
   ===================================================================== */
:root {
  --bg: #faf7f2;
  --bg-alt: #f1ece3;
  --surface: #fffdf9;
  --text: #1d1b18;
  --muted: #6e675d;
  --accent: #b08d57;
  --accent-2: #141311;
  --on-accent: #ffffff;
  --border: rgba(176, 141, 87, .28);
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Montserrat', system-ui, sans-serif;
  --font-script: 'Pinyon Script', cursive;
  --radius: 2px;
  --btn-radius: 0;
  --shadow: 0 18px 50px rgba(20, 19, 17, .07);
  --hero-text: #f6efe2;
  --hero-overlay: linear-gradient(180deg, rgba(14,13,11,.45), rgba(14,13,11,.7));
  --orn-glyph: "◆";
  --fx-colors: #d8b77a, #f3e2b8, #b08d57;
  --intro-bg: #141311;
}
body { font-size: 16px; }

/* Marco dorado doble en la portada */
.hero-content { padding: clamp(40px, 7vw, 72px) clamp(20px, 6vw, 72px); }
.hero-content::before, .hero-content::after { content: ""; position: absolute; pointer-events: none; border: 1px solid rgba(216, 183, 122, .55); }
.hero-content::before { inset: 0; }
.hero-content::after { inset: 8px; border-color: rgba(216, 183, 122, .3); }
.hero-names { font-size: clamp(3.6rem, 11vw, 7.8rem); color: #f3e2b8; }
.hero-names .amp { font-family: var(--font-display); font-style: italic; font-size: .5em; color: var(--accent); }
.hero-deco { display: block; width: 90px; height: 1px; margin: 18px auto 0; background: var(--accent); }
.hd-side { border-color: rgba(216, 183, 122, .6); }
.hd-day { color: #f3e2b8; }
.btn-hero { background: transparent; border-color: #d8b77a; color: #f3e2b8; }
.btn-hero:hover { background: #d8b77a; color: #141311; }

.section-title { font-weight: 500; letter-spacing: .02em; }
.section-orn { font-size: 9px; }
.card { box-shadow: none; position: relative; }
.card::after { content: ""; position: absolute; inset: 6px; border: 1px solid var(--border); pointer-events: none; }
.card-icon { background: transparent; border: 1px solid var(--accent); }
.cd-item { box-shadow: none; background: transparent; border-color: var(--accent); }
.tl-photo img { filter: grayscale(.25) contrast(1.05); }
.tl-photo { position: relative; }
.tl-photo::after { content: ""; position: absolute; inset: 12px -12px -12px 12px; border: 1px solid var(--accent); z-index: -1; }
.carousel-viewport { border-radius: 0; }
.map-frame iframe { filter: grayscale(1) contrast(1.05) sepia(.15); }

/* Intro estilo sobre negro */
.intro-card { background: #1d1b18; border-color: rgba(216,183,122,.4); color: #f3e2b8; }
.intro-names { color: #f3e2b8; }
.intro-kicker, .intro-date, .intro-para { color: #bfb39c; }

.footer { color: #f3e2b8; }
.footer-names { color: #f3e2b8; }

</style>
</head>

  const eventoId = (params.get('evento') || 'boda-elegante').replace(/[^\w-]/g, '');

  const esPreview = params.has('preview');

  /* ---------- Íconos (trazos simples, heredan el color del tema) ---------- */
  const ICONOS = {

    copo: '<path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/><path d="m9 4 3 2 3-2M9 20l3-2 3 2M4 10.5l3.5.3L9 7.5M20 13.5l-3.5-.3-1.5 3.3M4 13.5l3.5-.3 1.5 3.3M20 10.5l-3.5.3L15 7.5"/>',
    biberon: '<path d="M10 2h4M9 5h6l-1-3h-4zM8 8h8v12a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zM8 8l1-3M16 8l-1-3M8 12h3M8 15h3M8 18h3"/>',

    flor: '<circle cx="12" cy="9" r="2.5"/><path d="M12 6.5C12 3 15 3 15 5.5s-3 3-3 3M12 6.5C12 3 9 3 9 5.5s3 3 3 3M14.5 9c3.5 0 3.5 3 1 3s-3.5-3-3.5-3M9.5 9C6 9 6 12 8.5 12s3.5-3 3.5-3M12 11.5V22M12 18c-3 0-5-2-5-4 3 0 5 2 5 4zM12 16c3 0 5-2 5-4-3 0-5 2-5 4z"/>',
  };
  const icon = (n, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONOS[n] || ICONOS.corazon}</svg>`;

  /* ---------- Efecto decorativo por tema (se puede cambiar en config: efecto) ---------- */
  const EFECTO_TEMA = {
    elegante: 'polvo-dorado', floral: 'petalos', fiesta: 'confeti', xv: 'destellos',
    boho: 'petalos', minimalista: null, mexicano: 'confeti', playa: 'burbujas', gatsby: 'polvo-dorado',
    acuarela: 'burbujas', celestial: 'destellos', infantil: 'globos', invierno: 'nieve',
  };

  const TEXTOS = {

    contador: { kicker: 'Falta muy poco', titulo: 'Cuenta regresiva' },
    historia: { kicker: 'Así comenzó', titulo: 'Nuestra historia' },
    eventos: { kicker: 'Cuándo y dónde', titulo: 'Detalles del evento' },
    mapa: { kicker: 'Ubicación', titulo: 'Cómo llegar' },
    itinerario: { kicker: 'Programa', titulo: 'Itinerario' },
    vestimenta: { kicker: 'Dress code', titulo: 'Código de vestimenta' },
    galeria: { kicker: 'Momentos', titulo: 'Galería' },
    padrinos: { kicker: 'Con cariño', titulo: 'Padrinos' },
    regalos: { kicker: 'Detalles', titulo: 'Mesa de regalos' },
    hospedaje: { kicker: 'Para nuestros invitados', titulo: 'Hospedaje' },
    rsvp: { kicker: 'Te esperamos', titulo: 'Confirma tu asistencia' },

  const NAV = { bienvenida: 'Inicio', historia: 'Historia', eventos: 'Evento', mapa: 'Mapa', itinerario: 'Programa', vestimenta: 'Vestimenta', galeria: 'Galería', padrinos: 'Padrinos', regalos: 'Regalos', hospedaje: 'Hospedaje', rsvp: 'Confirmar' };
  const ORDEN = ['bienvenida', 'contador', 'historia', 'eventos', 'mapa', 'itinerario', 'vestimenta', 'galeria', 'padrinos', 'regalos', 'hospedaje', 'rsvp'];

  /* ---------- Arranque ---------- */
  // Versión de un solo archivo (carpeta "listas/"): los datos y estilos ya vienen dentro de la página.
  if (window.EVENTO && window.EVENTO_EMBEBIDO) {
    setTimeout(() => iniciar(window.EVENTO)); // espera a que todo el motor esté definido
  } else {
    const s = document.createElement('script');
    s.src = `eventos/${eventoId}.js`;
    s.onload = () => (window.EVENTO ? iniciar(window.EVENTO) : error());
    s.onerror = error;
    document.head.appendChild(s);
  }

  function error() {
    document.body.classList.remove('cargando');
    qs('#app').innerHTML = `<div class="error-carga"><h1>Invitación no encontrada</h1>
      <p>No se encontró <code>eventos/${esc(eventoId)}.js</code>.</p>
      <p>Si abriste este archivo desde el .zip, primero descomprime la carpeta completa.<br>
      O usa las versiones de un solo archivo que vienen en la carpeta <code>listas/</code>.</p>
      <a href="index.html">Ver plantillas</a></div>`;
  }

  function iniciar(E) {
    const tema = (E.tema || 'elegante').replace(/[^\w-]/g, '');
    document.body.classList.add('tema-' + tema, 'tipo-' + (E.tipo || 'evento'));
    document.title = `${E.titulo || 'Invitación'} · ${(E.nombres || []).join(' & ')}`;

    // Colores personalizados (sobrescriben el tema)
    if (E.colores) Object.entries(E.colores).forEach(([k, v]) => document.documentElement.style.setProperty('--' + k, v));

    if (window.EVENTO_EMBEBIDO) { render(E, tema); return; }
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `css/temas/${tema}.css`;
    let listo = false;
    const pintar = () => { if (listo) return; listo = true; render(E, tema); };
    link.onload = pintar;
    link.onerror = pintar;
    document.head.appendChild(link);
    setTimeout(pintar, 2500); // por si la hoja tarda
  }

  /* ---------- Utilidades de fecha ---------- */
  const fechaDe = (E) => (E.fecha ? new Date(E.fecha) : null);
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
  const fmt = (d, o) => new Intl.DateTimeFormat('es-MX', o).format(d);

  function head(sec, extra = {}) {
    const t = { ...TEXTOS[sec], ...extra };
    return `<header class="section-head reveal">
      ${t.kicker ? `<p class="section-kicker">${esc(t.kicker)}</p>` : ''}
      <h2 class="section-title">${esc(t.titulo)}</h2>
      <span class="section-orn" aria-hidden="true"></span>
    </header>`;
  }

  function nombresHTML(E) {
    const n = E.nombres || [];
    if (n.length < 2) return `<span class="hn">${esc(n[0] || '')}</span>`;
    return n.map((x) => `<span class="hn">${esc(x)}</span>`).join(`<span class="amp">${esc(E.conector || '&')}</span>`);
  }

  function iniciales(E) {
    return (E.nombres || []).map((n) => n.trim().charAt(0).toUpperCase()).join(E.nombres.length > 1 ? '&' : '');
  }

  /* =====================================================================
     Secciones
     ===================================================================== */
  const S = {};

  S.intro = (E) => {
    const f = fechaDe(E);
    return `<div class="intro" id="intro" role="dialog" aria-label="Abrir invitación">
      <div class="intro-card">
        <p class="intro-kicker">${esc(E.titulo || 'Estás invitado')}</p>
        <div class="seal" aria-hidden="true"><span>${esc(iniciales(E))}</span></div>
        <div class="intro-names">${nombresHTML(E)}</div>
        ${f ? `<p class="intro-date">${fmt(f, { day: 'numeric', month: 'long', year: 'numeric' })}</p>` : ''}
        ${invitado ? `<p class="intro-para">Para: <strong>${esc(invitado)}</strong></p>` : ''}
        <button class="btn" id="abrir">${esc(E.textoAbrir || 'Abrir invitación')}</button>
      </div>
    </div>`;
  };

  S.nav = (E, secciones) => {
    const links = secciones.filter((k) => NAV[k]).map((k) => `<a href="#${k}">${NAV[k]}</a>`).join('');
    return `<nav class="topnav" id="topnav" aria-label="Secciones">
      <a class="brand" href="#inicio">${esc(iniciales(E))}</a>
      <button class="nav-toggle" aria-label="Menú" aria-expanded="false">${icon('menu')}</button>
      <div class="nav-links">${links}</div>
    </nav>`;
  };

  S.hero = (E) => {
    const f = fechaDe(E);
    const portada = E.portada ? `<div class="hero-photo"><img src="${esc(E.portada)}" alt="" fetchpriority="high"></div>` : '';
    const fecha = f
      ? `<div class="hero-date">
          <span class="hd-side">${cap(fmt(f, { weekday: 'long' }))}</span>
          <span class="hd-day">${fmt(f, { day: 'numeric' })}</span>
          <span class="hd-side">${cap(fmt(f, { month: 'long' }))} ${fmt(f, { year: 'numeric' })}</span>
        </div>`
      : '';
    return `<header class="hero" id="inicio">
      <canvas class="fx" aria-hidden="true"></canvas>
      <div class="hero-inner">
        ${portada}
        <div class="hero-content">
          <p class="eyebrow">${esc(E.titulo || '')}</p>
          <span class="hero-deco" aria-hidden="true"></span>
          ${E.subtitulo ? `<p class="hero-sub">${esc(E.subtitulo)}</p>` : ''}
          <h1 class="hero-names">${nombresHTML(E)}</h1>
          ${fecha}
          ${E.frase ? `<p class="hero-phrase">${esc(E.frase)}</p>` : ''}
          <a href="#rsvp" class="btn btn-hero">Confirmar asistencia</a>
        </div>
      </div>
      <a class="scroll-hint" href="#${E.bienvenida ? 'bienvenida' : 'contador'}" aria-label="Bajar">${icon('flecha')}</a>
    </header>`;
  };

  S.pase = () => {
    if (!invitado) return '';
    const p = pasesURL > 0 ? pasesURL : null;
    return `<section class="pase" id="pase"><div class="container narrow">
      <div class="pase-card reveal">
        <p class="pase-label">Esta invitación es para</p>
        <p class="pase-nombre">${esc(invitado)}</p>
        ${p ? `<p class="pase-lugares">Hemos reservado <strong>${p}</strong> ${p === 1 ? 'lugar' : 'lugares'} en tu honor</p>` : ''}
      </div>
    </div></section>`;
  };

  S.bienvenida = (E) => {
    const b = E.bienvenida;
    if (!b) return '';
    return `<section id="bienvenida"><div class="container narrow center">
      ${head('bienvenida', b)}
      ${b.texto ? `<p class="lead reveal">${esc(b.texto)}</p>` : ''}
      ${b.cita ? `<blockquote class="cita reveal"><p>${esc(b.cita)}</p>${b.citaAutor ? `<cite>${esc(b.citaAutor)}</cite>` : ''}</blockquote>` : ''}
      ${b.padres ? `<div class="padres">${b.padres.map((g) => `<div class="padres-grupo reveal"><h3>${esc(g.titulo)}</h3>${g.nombres.map((n) => `<p>${esc(n)}</p>`).join('')}</div>`).join('')}</div>` : ''}
    </div></section>`;
  };

  S.contador = (E) => {
    const f = fechaDe(E);
    if (!f || E.contador === false) return '';
    return `<section id="contador"><div class="container center">
      ${head('contador', E.textosContador)}
      <div class="countdown reveal" data-fecha="${f.toISOString()}">
        ${['Días', 'Horas', 'Min', 'Seg'].map((l) => `<div class="cd-item"><span class="cd-num">00</span><span class="cd-label">${l}</span></div>`).join('')}
      </div>
      <p class="cd-fecha reveal">${cap(fmt(f, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))} · ${fmt(f, { hour: 'numeric', minute: '2-digit' })}</p>
      <div class="btn-row reveal">
        <a class="btn btn-ghost" id="cal-google" target="_blank" rel="noopener">${icon('calendario')} Google Calendar</a>
        <button class="btn btn-ghost" id="cal-ics">${icon('calendario')} Apple / Outlook</button>
      </div>
    </div></section>`;
  };

  S.historia = (E) => {
    const h = E.historia;
    if (!h || !h.momentos) return '';
    return `<section id="historia"><div class="container">
      ${head('historia', h)}
      ${h.intro ? `<p class="lead center narrow reveal">${esc(h.intro)}</p>` : ''}
      <div class="timeline">
        ${h.momentos.map((m, i) => `<article class="tl-item reveal ${i % 2 ? 'tl-alt' : ''}">
          ${m.foto ? `<div class="tl-photo"><img src="${esc(m.foto)}" alt="${esc(m.titulo)}" loading="lazy"></div>` : '<div class="tl-photo tl-empty"></div>'}
          <span class="tl-dot" aria-hidden="true"></span>
          <div class="tl-body">
            ${m.fecha ? `<span class="tl-date">${esc(m.fecha)}</span>` : ''}
            <h3>${esc(m.titulo)}</h3>
            <p>${esc(m.texto)}</p>
          </div>
        </article>`).join('')}
      </div>
    </div></section>`;
  };

  const mapsQuery = (ev) => (ev.coordenadas ? ev.coordenadas.join(',') : ev.mapa || `${ev.lugar || ''} ${ev.direccion || ''}`);
  const mapsLink = (ev) => ev.linkMaps || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapsQuery(ev))}`;
  const mapsEmbed = (ev) => ev.mapaEmbed || `https://maps.google.com/maps?q=${encodeURIComponent(mapsQuery(ev))}&z=15&output=embed`;
  const wazeLink = (ev) => `https://waze.com/ul?q=${encodeURIComponent(mapsQuery(ev))}&navigate=yes`;

  S.eventos = (E) => {
    const list = E.eventos;
    if (!list || !list.length) return '';
    const conMapa = E.mapa !== false;
    return `<section id="eventos"><div class="container">
      ${head('eventos', E.textosEventos)}
      <div class="cards cards-${Math.min(list.length, 3)}">
        ${list.map((ev, i) => `<article class="card event-card reveal">
          <div class="card-icon">${icon(ev.icono || 'corazon')}</div>
          <h3>${esc(ev.titulo)}</h3>
          ${ev.hora ? `<p class="ev-time">${esc(ev.hora)}</p>` : ''}
          <p class="ev-place">${esc(ev.lugar)}</p>
          ${ev.direccion ? `<p class="ev-address">${esc(ev.direccion)}</p>` : ''}
          <div class="card-actions">
            <a class="btn btn-sm" href="${esc(mapsLink(ev))}" target="_blank" rel="noopener">${icon('pin')} Cómo llegar</a>
            ${conMapa ? `<a class="btn btn-sm btn-ghost" href="#mapa" data-map-go="${i}">Ver mapa</a>` : ''}
          </div>
        </article>`).join('')}
      </div>
    </div></section>`;
  };

  S.mapa = (E) => {
    const list = E.eventos;
    if (!list || !list.length || E.mapa === false) return '';
    return `<section id="mapa"><div class="container">
      ${head('mapa')}
      ${list.length > 1 ? `<div class="tabs reveal" role="tablist">${list.map((ev, i) => `<button role="tab" class="tab ${i ? '' : 'active'}" data-map="${i}" aria-selected="${!i}">${esc(ev.titulo)}</button>`).join('')}</div>` : ''}
      <div class="map-frame reveal">
        <iframe title="Mapa" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${esc(mapsEmbed(list[0]))}"></iframe>
      </div>
      <div class="btn-row reveal">
        <a class="btn" id="map-gmaps" href="${esc(mapsLink(list[0]))}" target="_blank" rel="noopener">${icon('pin')} Google Maps</a>
        <a class="btn btn-ghost" id="map-waze" href="${esc(wazeLink(list[0]))}" target="_blank" rel="noopener">Waze</a>
      </div>
    </div></section>`;
  };

  S.itinerario = (E) => {
    const it = E.itinerario;
    if (!it || !it.length) return '';
    return `<section id="itinerario"><div class="container narrow">
      ${head('itinerario')}
      <ol class="agenda">
        ${it.map((x) => `<li class="reveal"><span class="ag-hora">${esc(x.hora)}</span><span class="ag-ico">${icon(x.icono || 'estrella')}</span><span class="ag-txt">${esc(x.actividad)}</span></li>`).join('')}
      </ol>
    </div></section>`;
  };

  S.vestimenta = (E) => {
    const v = E.vestimenta;
    if (!v) return '';
    return `<section id="vestimenta"><div class="container narrow center">
      ${head('vestimenta')}
      <div class="card dress-card reveal">
        <div class="card-icon">${icon('vestido')}</div>
        <h3 class="dress-code">${esc(v.codigo)}</h3>
        ${v.descripcion ? `<p>${esc(v.descripcion)}</p>` : ''}
        ${v.colores ? `<div class="swatches">${v.colores.map((c) => `<span class="swatch" style="background:${esc(c)}" title="${esc(c)}"></span>`).join('')}</div>` : ''}
        ${v.nota ? `<p class="nota">${esc(v.nota)}</p>` : ''}
      </div>
    </div></section>`;
  };

  S.galeria = (E) => {
    const g = E.galeria;
    const fotos = g && (Array.isArray(g) ? g : g.fotos);
    if (!fotos || !fotos.length) return '';
    const items = fotos.map((f) => (typeof f === 'string' ? { src: f } : f));
    return `<section id="galeria"><div class="container">
      ${head('galeria', Array.isArray(g) ? {} : g)}
      <div class="carousel reveal" data-carousel tabindex="0" aria-roledescription="carrusel">
        <div class="carousel-viewport"><div class="carousel-track">
          ${items.map((f, i) => `<figure class="carousel-slide" aria-label="${i + 1} de ${items.length}">
            <img src="${esc(f.src)}" alt="${esc(f.alt || f.texto || 'Foto ' + (i + 1))}" loading="${i ? 'lazy' : 'eager'}" data-index="${i}">
            ${f.texto ? `<figcaption>${esc(f.texto)}</figcaption>` : ''}
          </figure>`).join('')}
        </div></div>
        <button class="carousel-btn prev" aria-label="Anterior">${icon('izq')}</button>
        <button class="carousel-btn next" aria-label="Siguiente">${icon('der')}</button>
        <div class="carousel-dots">${items.map((_, i) => `<button aria-label="Ir a foto ${i + 1}" data-dot="${i}"></button>`).join('')}</div>
      </div>
    </div></section>`;
  };

  S.padrinos = (E) => {
    const p = E.padrinos;

  /* =====================================================================

  function render(E, tema) {
    const orden = (E.orden || ORDEN).filter((k) => S[k]);
    const partes = orden.map((k) => [k, S[k](E)]).filter(([, h]) => h);
    const secciones = partes.map(([k]) => k);
    const usarIntro = E.intro !== false && !esPreview;

    qs('#app').innerHTML = [
      usarIntro ? S.intro(E) : '',
      S.nav(E, secciones),
      S.hero(E),
      '<main>',
      S.pase(),
      partes.map(([, h]) => h).join(''),
      '</main>',
      S.footer(E),
      S.musica(E),
      '<div class="toast" id="toast" role="status"></div>',
    ].join('');

    // Alternar fondos de sección
    qsa('main > section').forEach((sec, i) => sec.classList.toggle('alt', i % 2 === 1));
    document.body.classList.remove('cargando');

    const efecto = E.efecto === undefined ? EFECTO_TEMA[tema] : E.efecto;
    particulas(qs('.hero .fx'), efecto, qs('.hero'));
    particulas(qs('.footer .fx'), efecto, qs('.footer'), 0.5);

    if (usarIntro) intro(E, efecto);
    nav();
    reveal();
    contador(E);
    calendario(E);
    mapa(E);
    qsa('[data-carousel]').forEach(carrusel);
    copiar();
    rsvp(E, efecto);
    musica();
  }

  function toast(msg) {
    const t = qs('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function intro(E, efecto) {
    document.body.classList.add('intro-abierta');
    qs('#abrir').addEventListener('click', () => {
      qs('#intro').classList.add('cerrar');
      document.body.classList.remove('intro-abierta');
      const a = qs('#audio');
      if (a) a.play().then(() => qs('#music-btn').classList.add('playing')).catch(() => {});
      if (efecto === 'confeti') festejo();
      setTimeout(() => qs('#intro')?.remove(), 1200);
    });
  }

  function nav() {
    const n = qs('#topnav');
    const onScroll = () => n.classList.toggle('scrolled', scrollY > innerHeight * 0.6);
    addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    const t = qs('.nav-toggle');
    t.addEventListener('click', () => {
      const open = n.classList.toggle('open');
      t.setAttribute('aria-expanded', open);
    });
    qsa('.nav-links a').forEach((a) => a.addEventListener('click', () => n.classList.remove('open')));
  }

  function reveal() {
    const els = qsa('.reveal');
    if (!('IntersectionObserver' in window)) return els.forEach((e) => e.classList.add('visible'));
    const io = new IntersectionObserver((ents) => ents.forEach((en) => {
      if (en.isIntersecting) { en.target.classList.add('visible'); io.unobserve(en.target); }
    }), { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    els.forEach((e) => io.observe(e));
  }

  function contador(E) {
    const cd = qs('.countdown');
    if (!cd) return;
    const meta = new Date(cd.dataset.fecha).getTime();
    const nums = qsa('.cd-num', cd);
    const tick = () => {
      let d = Math.max(0, meta - Date.now());
      const v = [864e5, 36e5, 6e4, 1e3].map((u) => { const x = Math.floor(d / u); d -= x * u; return x; });
      nums.forEach((n, i) => (n.textContent = String(v[i]).padStart(2, '0')));
      if (meta <= Date.now()) cd.classList.add('llego');
    };
    tick();
    setInterval(tick, 1000);
  }

  function calendario(E) {
    const f = fechaDe(E);
    if (!f) return;
    const fin = new Date(f.getTime() + (E.duracionHoras || 6) * 36e5);
    const p = (n) => String(n).padStart(2, '0');
    const local = (d) => `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
    const utc = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const titulo = `${E.titulo || 'Evento'} · ${(E.nombres || []).join(' & ')}`;
    const ev0 = (E.eventos || [])[0] || {};
    const lugar = [ev0.lugar, ev0.direccion].filter(Boolean).join(', ');
    const g = qs('#cal-google');
    if (g) g.href = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&dates=${local(f)}/${local(fin)}&ctz=${encodeURIComponent(E.zonaHoraria || 'America/Mexico_City')}&details=${encodeURIComponent(location.href.split('&invitado')[0])}&location=${encodeURIComponent(lugar)}`;
    const b = qs('#cal-ics');
    if (b) b.addEventListener('click', () => {
      const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Invitaciones//ES', 'BEGIN:VEVENT',
        `UID:${eventoId}-${utc(f)}@invitacion`, `DTSTAMP:${utc(new Date())}`, `DTSTART:${utc(f)}`, `DTEND:${utc(fin)}`,
        `SUMMARY:${titulo}`, `LOCATION:${lugar.replace(/,/g, '\\,')}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
      a.download = `${eventoId}.ics`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);

  function mapa(E) {

      const ev = E.eventos[i];

      qs('#map-waze').href = wazeLink(ev);

    };
    qsa('#mapa .tab').forEach((t) => t.addEventListener('click', () => set(+t.dataset.map)));

  function carrusel(root) {
    const track = qs('.carousel-track', root);
    const slides = qsa('.carousel-slide', root);
    const dots = qsa('[data-dot]', root);
    let i = 0, timer;
    const go = (n) => {
      i = (n + slides.length) % slides.length;
      track.style.transform = `translateX(${-i * 100}%)`;
      dots.forEach((d, j) => d.classList.toggle('active', j === i));
      slides.forEach((s, j) => s.setAttribute('aria-hidden', j !== i));
    };
    const auto = () => { clearInterval(timer); timer = setInterval(() => go(i + 1), 5000); };
    qs('.prev', root).addEventListener('click', () => { go(i - 1); auto(); });
    qs('.next', root).addEventListener('click', () => { go(i + 1); auto(); });
    dots.forEach((d) => d.addEventListener('click', () => { go(+d.dataset.dot); auto(); }));
    root.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') go(i - 1); if (e.key === 'ArrowRight') go(i + 1); });
    root.addEventListener('mouseenter', () => clearInterval(timer));
    root.addEventListener('mouseleave', auto);

    // Deslizar con el dedo
    let x0 = null, dx = 0;
    const vp = qs('.carousel-viewport', root);
    vp.addEventListener('pointerdown', (e) => { x0 = e.clientX; dx = 0; track.style.transition = 'none'; clearInterval(timer); });
    vp.addEventListener('pointermove', (e) => {
      if (x0 === null) return;
      dx = e.clientX - x0;
      track.style.transform = `translateX(calc(${-i * 100}% + ${dx}px))`;
    });
    const end = () => {
      if (x0 === null) return;
      track.style.transition = '';
      if (Math.abs(dx) > 50) go(dx < 0 ? i + 1 : i - 1); else go(i);
      x0 = null; auto();
    };
    vp.addEventListener('pointerup', end);
    vp.addEventListener('pointerleave', end);
    vp.addEventListener('pointercancel', end);

    // Ver en grande (clic sin arrastrar)
    slides.forEach((s, j) => qs('img', s).addEventListener('click', () => { if (Math.abs(dx) < 5) lightbox(slides.map((x) => qs('img', x)), j); }));
    qsa('img', track).forEach((img) => img.setAttribute('draggable', 'false'));
    go(0);
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) auto();
  }

  function lightbox(imgs, start) {
    let i = start;
    const lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.innerHTML = `<button class="lb-close" aria-label="Cerrar">${icon('cerrar')}</button>
      <button class="lb-nav lb-prev" aria-label="Anterior">${icon('izq')}</button>
      <img alt=""><button class="lb-nav lb-next" aria-label="Siguiente">${icon('der')}</button>`;
    const img = qs('img', lb);
    const show = () => { img.src = imgs[i].src; img.alt = imgs[i].alt; };
    const close = () => { lb.remove(); removeEventListener('keydown', key); };
    const key = (e) => {
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') { i = (i - 1 + imgs.length) % imgs.length; show(); }
      if (e.key === 'ArrowRight') { i = (i + 1) % imgs.length; show(); }
    };
    qs('.lb-close', lb).onclick = close;
    qs('.lb-prev', lb).onclick = () => { i = (i - 1 + imgs.length) % imgs.length; show(); };
    qs('.lb-next', lb).onclick = () => { i = (i + 1) % imgs.length; show(); };
    lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
    addEventListener('keydown', key);
    show();
    document.body.appendChild(lb);
  }

  function copiar() {
    qsa('[data-copy]').forEach((b) => b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); toast('Copiado al portapapeles'); }
      catch (e) { toast(b.dataset.copy); }

  function rsvp(E, efecto) {
    const form = qs('#rsvp-form');
    if (!form) return;
    const r = E.rsvp;
    const gracias = qs('.rsvp-gracias');
    const err = qs('.form-error', form);
    const clave = 'rsvp-hecho-' + eventoId + (invitado ? '-' + invitado : '');

    const toggleSi = () => {
      const si = form.asistencia.value === 'si';
      qsa('[data-si]', form).forEach((el) => (el.hidden = !si));
    };
    qsa('input[name=asistencia]', form).forEach((x) => x.addEventListener('change', toggleSi));

    const mostrarGracias = (d) => {
      const si = d.asistencia === 'si';
      const nombres = (E.nombres || []).join(' y ');
      const msgWA = `Hola, soy ${d.nombre}. ${si ? `Confirmo mi asistencia (${d.personas} ${d.personas == 1 ? 'persona' : 'personas'})` : 'Lamentablemente no podré asistir'} a ${E.titulo || 'el evento'} de ${nombres}.`;
      gracias.innerHTML = `<div class="gracias-ico">${icon(si ? 'corazon' : 'sobre')}</div>
        <h3>${si ? '¡Gracias por confirmar!' : 'Gracias por avisarnos'}</h3>
        <p>${si ? `Te esperamos, <strong>${esc(d.nombre)}</strong>. Registramos ${esc(d.personas)} ${d.personas == 1 ? 'lugar' : 'lugares'}.` : `Te extrañaremos, <strong>${esc(d.nombre)}</strong>.`}</p>
        <div class="btn-row">
          ${r.whatsapp ? `<a class="btn" href="https://wa.me/${esc(r.whatsapp)}?text=${encodeURIComponent(msgWA)}" target="_blank" rel="noopener">Avisar por WhatsApp</a>` : ''}
          <button class="btn btn-ghost" id="rsvp-cambiar">Cambiar respuesta</button>
        </div>`;
      form.hidden = true;
      gracias.hidden = false;
      qs('#rsvp-cambiar').onclick = () => { form.hidden = false; gracias.hidden = true; };
    };

    const previo = store.get(clave);
    if (previo) mostrarGracias(previo);
    toggleSi();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      const fd = new FormData(form);
      const d = Object.fromEntries(fd.entries());
      d.nombre = (d.nombre || '').trim();
      if (!d.nombre) { err.textContent = 'Por favor escribe tu nombre.'; err.hidden = false; form.nombre.focus(); return; }
      if (d.asistencia === 'no') d.personas = 0;
      Object.assign(d, { evento: eventoId, invitado, pasesAsignados: pasesURL > 0 ? pasesURL : '', enviado: new Date().toISOString() });

      const btn = qs('button[type=submit]', form);
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        if (r.endpoint) {
          // Google Apps Script: text/plain evita el bloqueo CORS; la respuesta es opaca pero el registro se guarda.
          await fetch(r.endpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(d) });
        } else {
          const k = 'rsvp-demo-' + eventoId;
          store.set(k, [...(store.get(k) || []), d]);
        }
        store.set(clave, d);
        mostrarGracias(d);
        if (d.asistencia === 'si' && efecto) festejo();
      } catch (ex) {
        err.textContent = 'No pudimos enviar tu respuesta. Revisa tu conexión e inténtalo de nuevo.';
        err.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar confirmación';
      }
    });
  }

  function musica() {
    const b = qs('#music-btn');
    if (!b) return;
    const a = qs('#audio');
    b.addEventListener('click', () => {
      if (a.paused) a.play().then(() => b.classList.add('playing')).catch(() => toast('No se pudo reproducir'));
      else { a.pause(); b.classList.remove('playing'); }

  /* ---------- Partículas decorativas (canvas) ---------- */
  const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coloresFx = () => getComputedStyle(document.body).getPropertyValue('--fx-colors').split(',').map((x) => x.trim()).filter(Boolean);

  function particulas(canvas, tipo, host, densidad = 1) {
    if (!canvas || !tipo || reduce()) return;
    const ctx = canvas.getContext('2d');
    const colors = coloresFx().length ? coloresFx() : ['#d4af37'];
    let W = 0, H = 0, visible = true, raf;
    const N = Math.round(({ petalos: 22, destellos: 45, confeti: 55, 'polvo-dorado': 60, nieve: 90, burbujas: 26, globos: 9 }[tipo] || 30) * densidad);
    const sube = ['polvo-dorado', 'burbujas', 'globos'].includes(tipo);
    const R = { 'polvo-dorado': [0.6, 2.2], destellos: [2, 6], nieve: [1, 3.6], burbujas: [3, 13], globos: [14, 22] };
    const V = { 'polvo-dorado': [-0.5, -0.15], destellos: [-0.15, 0.15], nieve: [0.3, 1.1], burbujas: [-0.9, -0.25], globos: [-0.8, -0.35], confeti: [0.5, 2.2] };
    const rnd = (a, b) => a + Math.random() * (b - a);
    const P = [];
    const spawn = (p, inicio) => {
      p.c = colors[Math.floor(Math.random() * colors.length)];
      p.r = rnd(...(R[tipo] || [5, 10]));
      p.x = rnd(0, W); p.y = inicio ? rnd(0, H) : (sube ? H + p.r * 3 : -20);
      p.vy = rnd(...(V[tipo] || [0.5, 1.1]));
      p.vx = rnd(-0.3, 0.3); p.a = rnd(0, Math.PI * 2); p.va = rnd(-0.04, 0.04); p.t = rnd(0, 100); p.ts = rnd(0.02, 0.06);
      return p;
    };
    const resize = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      W = canvas.clientWidth; H = canvas.clientHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    for (let i = 0; i < N; i++) P.push(spawn({}, true));
    addEventListener('resize', resize);
    new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible) loop(); }).observe(host);

    function draw(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.fillStyle = p.c;
      if (tipo === 'petalos') {
        ctx.globalAlpha = 0.75;
        ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      } else if (tipo === 'confeti') {
        ctx.scale(1, Math.cos(p.t));
        ctx.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * 0.6);
      } else if (tipo === 'nieve') {
        ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
      } else if (tipo === 'burbujas') {
        ctx.globalAlpha = 0.55;
        ctx.strokeStyle = p.c; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 0.35;
        ctx.beginPath(); ctx.arc(-p.r * 0.35, -p.r * 0.35, p.r * 0.22, 0, Math.PI * 2); ctx.fill();
      } else if (tipo === 'globos') {
        ctx.rotate(-p.a + Math.sin(p.t) * 0.08);
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, p.r * 1.2); ctx.quadraticCurveTo(p.r * 0.4, p.r * 2.2, 0, p.r * 3.2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 1.2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-3, p.r * 1.3); ctx.lineTo(3, p.r * 1.3); ctx.lineTo(0, p.r * 1.12); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.35;
        ctx.beginPath(); ctx.ellipse(-p.r * 0.35, -p.r * 0.45, p.r * 0.18, p.r * 0.32, -0.5, 0, Math.PI * 2); ctx.fill();
      } else if (tipo === 'destellos') {
        ctx.globalAlpha = 0.25 + 0.75 * Math.abs(Math.sin(p.t));
        const r = p.r;
        ctx.beginPath();
        ctx.moveTo(0, -r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.quadraticCurveTo(0, 0, 0, r);
        ctx.quadraticCurveTo(0, 0, -r, 0); ctx.quadraticCurveTo(0, 0, 0, -r); ctx.fill();
      } else {
        ctx.globalAlpha = 0.3 + 0.6 * Math.abs(Math.sin(p.t));
        ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    function loop() {
      cancelAnimationFrame(raf);
      if (!visible) return;
      ctx.clearRect(0, 0, W, H);
      for (const p of P) {
        p.t += p.ts; p.a += p.va;
        p.x += p.vx + (['petalos', 'nieve', 'burbujas', 'globos'].includes(tipo) ? Math.sin(p.t) * (tipo === 'globos' ? 0.3 : 0.6) : 0);
        p.y += p.vy;
        const m = p.r * 4 + 30;
        if (p.y > H + m || p.y < -m || p.x < -m || p.x > W + m) spawn(p, tipo === 'destellos');
        draw(p);
      }
      raf = requestAnimationFrame(loop);
    }
    loop();
  }

  // Ráfaga de confeti a pantalla completa (al confirmar asistencia)
  function festejo() {
    if (reduce()) return;
    const c = document.createElement('canvas');
    c.className = 'festejo';
    document.body.appendChild(c);
    const ctx = c.getContext('2d');
    const W = (c.width = innerWidth), H = (c.height = innerHeight);
    const colors = coloresFx().length ? coloresFx() : ['#e91e63', '#ffc107', '#3f51b5'];
    const P = Array.from({ length: 140 }, () => ({
      x: W / 2, y: H * 0.6, vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 16 - 6,
      r: 5 + Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)], a: Math.random() * 6, t: Math.random() * 6,
    }));
    const t0 = performance.now();
    (function f(now) {
      ctx.clearRect(0, 0, W, H);
      P.forEach((p) => {
        p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += 0.1; p.t += 0.15;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.scale(1, Math.cos(p.t));
        ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
      });
      if (now - t0 < 3200) requestAnimationFrame(f); else c.remove();
    })(t0);
  }
})();

</script>
